name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Python + native OPA / ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
          - {os: macos-15-intel, python: '3.14'}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Source Tk imports on disposable Linux worker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libtk8.6
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m cial.tooling opa
      - run: npm ci --ignore-scripts
      - run: npm run build
      - shell: bash
        run: bash scripts/validate.sh
  native:
    name: Native Rego + Terraform / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m cial.tooling opa
      - run: python -m cial.tooling terraform
      - shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          ".tools/opa$suffix" fmt --list --fail policy
          ".tools/opa$suffix" check --strict policy
          ".tools/opa$suffix" test policy -v
          ".tools/terraform$suffix" -chdir=infra fmt -check -recursive
          ".tools/terraform$suffix" -chdir=infra init -backend=false -input=false
          ".tools/terraform$suffix" -chdir=infra validate
          ".tools/terraform$suffix" -chdir=infra test -no-color
  browser:
    name: Browser / Chromium, Firefox, WebKit, mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m cial.tooling opa
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
  security:
    name: Security / locked graphs, secrets and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: npm ci --ignore-scripts
      - run: |
          python -m pip_audit -r requirements-dev.lock --disable-pip --no-deps
          npm run audit
          python scripts/scanners.py gitleaks
          python scripts/scanners.py actionlint
          .tools/gitleaks git . --redact --no-banner
          .tools/actionlint
          shellcheck scripts/validate.sh

  native-windows:
    name: Native Windows portable / patched Python3.14.10
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.10'
      - name: Exact complete Python/native graph and genuine pinned OPA
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock -r requirements-native.lock
          python -m pip_audit -r requirements-dev.lock -r requirements-native.lock --disable-pip --no-deps
          python -m cial.tooling opa
      - name: Complete real native app and two-process signature/policy journey
        run: |
          python scripts/build_native.py
          python scripts/test_native_app.py
